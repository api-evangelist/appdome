openapi: 3.2.0
info:
  version: 1.0.0
  title: Appdome Secure Certificate API
servers:
- url: https://fusion.appdome.com/api/v1
  description: Main Appdome API Server
- url: '{aws_upload_link}'
  description: S3 Upload URL
  variables:
    aws_upload_link:
      default: ''
      description: The S3 bucket name from the pre-signed URL. Obtained from 'Get AWS Upload Link' route.
tags:
- name: Secure Certificate
paths:
  /tasks/{task_id}/certificate:
    get:
      tags:
      - Secure Certificate
      description: Download Appdome’s Certified Secure certificate (PDF file) of your secured App/SDK, identified by its task ID
      summary: Download Secure-Certificate PDF
      parameters:
      - description: Personal or team ID
        example: personal
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      - description: UUID of the task ID
        example: 123e4567-e89b-12d3-a456-426614174000
        name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - apiKey: []
      responses:
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      operationId: getTasksByTaskIdCertificate
      x-operation-id-source: derived
  /tasks/{task_id}/certificate-json:
    get:
      tags:
      - Secure Certificate
      description: You can send a GET request to download Appdome Certified Secure (JSON file) of your secured App/SDK.
      summary: Download Secure-Certificate JSON
      parameters:
      - description: UUID of team id
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      - description: UUID of task id
        name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - apiKey: []
      responses:
        '200':
          description: certificate-json of the task
          content:
            application/json:
              schema:
                type: object
                description: json
                example: {}
        '400':
          description: badRequest
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: badRequest
                  messages:
                    type: string
                    example: Certificate not found
                  statusCode:
                    type: number
                    example: 400
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: forbidden
                  messages:
                    type: string
                    example: You are not allowed to get the certified secure
                  statusCode:
                    type: number
                    example: 403
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      operationId: getTasksByTaskIdCertificateJson
      x-operation-id-source: derived
  /verify-certificate:
    post:
      tags:
      - Secure Certificate
      description: You can send a POST request to verify the Certified Secure certificate for the secured App/SDK using the Task ID.
      summary: Validate Certified Secure Certificate
      parameters: []
      security:
      - apiKey: []
      responses:
        '200':
          description: validation output
          content:
            application/json:
              schema:
                type: object
                properties:
                  verify:
                    type: boolean
                    description: output validation value
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                file:
                  type: string
      operationId: postVerifyCertificate
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
