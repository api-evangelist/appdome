openapi: 3.2.0
info:
  version: 1.0.0
  title: Appdome Tasks API
servers:
- url: https://fusion.appdome.com/api/v1
  description: Main Appdome API Server
- url: '{aws_upload_link}'
  description: S3 Upload URL
  variables:
    aws_upload_link:
      default: ''
      description: The S3 bucket name from the pre-signed URL. Obtained from 'Get AWS Upload Link' route.
tags:
- name: Tasks
paths:
  /Amazon upload link>:
    put:
      tags:
      - Tasks
      description: This endpoint allows you to upload an app or SDK to a public AWS URL obtained from the "Get Public Link" request. The URL serves as the endpoint for this PUT request. Ensure that the app or SDK you want to upload is included in the request body. The link will expire after a pre-defined period of 30 minutes, so the upload must be completed within this timeframe.
      summary: Upload to AWS
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  description: The app/sdk file to upload - should be binary file
                  type: string
              required:
              - fileName
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: s3 response
      operationId: putAmazon upload link>
      x-operation-id-source: derived
  /build-to-test#autoDev:
    post:
      tags:
      - Tasks
      description: 'Available overrides for Auto-DEV Signing Task:


        IOS:


        Key

        Name in Appdome

        Value

        Notes


        manual_entitlements_matching

        Manual Entitlements Matching

        Boolean


        Android:


        Key

        Name in Appdome

        Value

        Notes


        signing_sha1_fingerprint

        certificate SHA-1 fingerprint

        String

        When signing Android apps using Private Signing or Auto-DEV Signing, please add the certificate SHA-1 fingerprint as an override


        signing_keystore_use_google_signing

        Use Google Play App Signing

        Boolean

        Send true if you want to use different sha1 fingerprint, when true ''signing_keystore_google_signing_sha1_key'' is required.


        signing_keystore_google_signing_sha1_key

        App Signing Certificate Fingerprint

        String

        If ''signing_keystore_use_google_signing'' is true, attach the string of your sha1 fingerprint.


        signing_keystore_google_signing_upgrade

        Google Play Upgrade Signing Key

        Boolean

        Send true if you upgraded your app signing key for new installs.


        signing_keystore_google_signing_sha1_key_2nd_cert

        Upgraded Certificate Fingerprint

        String

        Your past key signing certificate fingerprint is required to tamper-proof built applications and allow them to run on legacy and new installs.


        trusted_signing_fingerprint_list

        Trusted Signing Fingerprint List

        Array of Objects

        Array of trusted signing certificate fingerprints. Each object contains: SHA (string, SHA-1 or SHA-256 fingerprint), TrustedStoreSigning {optional} (boolean). Android only.

        Must not be used together with signing_keystore_use_google_signing, signing_keystore_google_signing_upgrade, or signing_keystore_google_signing_sha1_key_2nd_cert'
      summary: Auto-DEV Sign an App for Testing
      parameters:
      - description: Personal or team ID
        example: personal
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: ID of the created fuse task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    example: lix-X4WwvH6joI9DqjdlnQ
                    description: ID of the created fuse task
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - sign_script
                parent_task_id:
                  type: string
                overrides:
                  type: string
                  description: 'example: {"signing_sha1_fingerprint":                                   "e5fa44f2b31c1fb553b6021e7360d07d5d91ff5e"} or {"trusted_signing_fingerprint_list":                                   [{"SHA": "e5fa44f2b31c1fb553b6021e7360d07d5d91ff5e", "TrustedStoreSigning": true }]}'
                provisioning_profile:
                  type: string
                  format: binary
                  description: (IOS only) underscore is not accepted in filename
                entitlements_files:
                  type: string
                  format: binary
                  description: (IOS only) Required if "manual_entitlements_matching" is true, underscore is not accepted in filename
      operationId: postBuildToTest#autoDev
      x-operation-id-source: derived
  /build-to-test#build:
    post:
      tags:
      - Tasks
      description: 'This API allows you to build and customize a mobile app or SDK with testing.

        After you upload your App/SDK and obtain the Application ID, you can build it for testing using an existing Fusion Set.

        The `fusion_set_id` is required to initiate the build (fuse) action.

        Upon completion of the build, a `parent_task_id` (known as the "Appdome Build ID") is generated, which is required for any subsequent task actions.

        This endpoint supports several customizations (overrides) for the build task, as detailed below.


        How to Obtain the Application ID:


        After successfully uploading your app to the Appdome platform, follow these steps:


        Navigate to the sidebar where your app is listed.


        The Application ID will be visible next to the app details, and you can copy it directly from there.


        Key

        Name in Appdome

        Value

        Notes


        user_agent

        User Agent Customization

        Boolean

        Must use with user_agent_value


        user_agent_value

        User-Agent Header

        String


        extended_logs

        Diagnostic Logs

        Boolean

        Only if enabled for the user.


        build_to_test_vendor

        supported Testing Service

        String

        One of the following values:


        AUTOMATION_AWS_DEVICE_FARM


        AUTOMATION_BITBAR


        AUTOMATION_BROWSERSTACK


        AUTOMATION_LAMBDATEST


        AUTOMATION_SAUCELABS


        AUTOMATION_FIREBASE


        AUTOMATION_KOBITON


        AUTOMATION_KATALON


        AUTOMATION_PERFECTO


        AUTOMATION_TRICENTIS_DEVICE_CLOUD


        build_to_test_message

        build_to_test_message

        String

        Must use with build_to_test_vendor.'
      summary: Build an App/SDK for Testing
      parameters:
      - description: Personal or team ID
        example: personal
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: ID of the created fuse task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    example: lix-X4WwvH6joI9DqjdlnQ
                    description: ID of the created fuse task
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - fuse
                app_id:
                  type: string
                fusion_set_id:
                  type: string
                overrides:
                  type: string
                  description: 'Fuse overrides enable modification of fusion set options for specific tasks. Learn more <a href=''https://apis.appdome.com/docs/build-an-app#overrides''>here</a>. <br/>Example input: {"build_to_test_vendor": "AUTOMATION_SAUCELABS", "build_to_test_message": "oops, something went wrong..."} --- example for Certificate Pinning: {"mitm_host_server_pinned_certs_list":[{"value": {"mitm_host_server_pinned_certs_type": "no_pinning","mitm_host_server_pinned_certs_domain":"{URL}", "mitm_host_server_pinned_certs_file_filename": "{filename}"}}]}'
                baseline_profile:
                  type: string
                  format: binary
                  description: Android only, a baseline profile file in a zip archive
                startup_profile:
                  type: string
                  format: binary
                  description: Android only, a startup profile file in a zip archive
                input_mapping:
                  type: string
                  format: binary
                  description: Android only, a minimization or obfuscation mapping file in a txt file
                mobile_anti_bot_list[{index}].value.payload_signing_key_app_specific:
                  type: string
                  format: binary
                  description: The index assigns each Payload Signing Key to a specific host profile. The first key is always index 0. Additional keys are indexed as 1, 2, 3, etc., for separate host profiles.
                mitm_host_server_pinned_certs_list[index].value.mitm_host_server_pinned_certs_file_content:
                  type: string
                  format: binary
                  description: 'The index assigns each Certificate to a specific pinning profile. The first key is always index 0. Additional keys are indexed as 1, 2, 3, etc., for separate host profiles.

                    There is an option to specify the exact host as stated in the original fusion set and it will be overridden by host name instead of index location'
      operationId: postBuildToTest#build
      x-operation-id-source: derived
  /build-to-test#context:
    post:
      tags:
      - Tasks
      description: 'The available overrides for the Context task are:


        Key

        Name in Appdome

        Value

        Notes


        icon_overlay

        Add Favicon

        Boolean

        Must use with icon_overlay_scale, icon_overlay_position, icon_overlay_filename


        Must also add Form data icon_overlay_s3 with an icon file (see above)


        icon_overlay_scale

        Scale

        Number between 20 and 50


        icon_overlay_position

        Favicon Position

        ‘Top Right’, ‘Top Left’, ‘Bottom Right’, ‘Bottom Left’


        customize_url_enable

        Private URL

        Boolean

        Must use with customize_url_value, customize_url_key.


        customize_url_value

        Private URL Value

        String


        customize_url_key

        Private URL Identifier

        String


        app_customization_pack_bundle_version

        App Version

        String


        app_customization_pack_bundle_identifier

        App Bundle ID

        String


        app_customization_pack_bundle_display_name

        App Display Name

        String


        app_customization_pack_bundle_build_number

        App Version Code

        Number


        app_customization_key_value_list

        Custom Values

        JSON

        LifeCycle, Context'
      summary: Add Context to an App for Testing
      parameters:
      - description: Personal or team ID
        example: personal
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: ID of the created fuse task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    example: lix-X4WwvH6joI9DqjdlnQ
                    description: ID of the created fuse task
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - context
                parent_task_id:
                  type: string
                overrides:
                  type: string
                  description: 'example: {"app_customization_pack_bundle_identifier": "com.appdome.test"}'
      operationId: postBuildToTest#context
      x-operation-id-source: derived
