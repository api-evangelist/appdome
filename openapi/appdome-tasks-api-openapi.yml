  /pwappload:
    post:
      tags:
      - Tasks
      description: 'This API creates a Secure PWA™ app from a provided URL for iOS (ipa), Android (aab), or both platforms.

        The request completes only after the PWA upload finishes. Use the returned App ID for the subsequent build flow.


        iOS PWA builds


        When pwa_platform is ipa or both, overrides is required and must include a base64-encoded provisioning profile:


        {

        "provisioning_profile": [

        {

        "filename": "[File Name]",

        "content": "[BASE64 CONTENT]"

        }

        ]

        }


        Response


        Returns an array of results (one entry per platform; two entries when pwa_platform is both). Each entry includes an app object with the App ID:


        [

        {

        "app": {

        "id": "5b4a3a56-1137-468e-bb82-375ca89e9b96",

        "pack_type": "ipa",

        "is_pwapp": true,

        "status": "active"

        }

        }

        ]


        Use app.id with the regular build API to select a Fusion Set and continue the build flow.'
      summary: Build a PWA
      parameters:
      - in: query
        name: team_id
        required: true
        description: Personal or Team ID
        schema:
          type: string
          default: personal
      security:
      - apiKey: []
      responses:
        '200':
          description: Array of PWA upload results. Each item includes an app object with the Application ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    app:
                      type: object
                      description: Uploaded PWA app. Use app.id as the Application ID for subsequent build/sign steps.
                      properties:
                        id:
                          type: string
                          example: 5b4a3a56-1137-468e-bb82-375ca89e9b96
                          description: Application ID
                        pack_type:
                          type: string
                          example: ipa
                          description: Platform pack type (ipa or aab)
                        is_pwapp:
                          type: boolean
                          example: true
                        status:
                          type: string
                          example: active
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pwa_address:
                  type: string
                pwa_platform:
                  type: string
                pwa_app_name:
                  type: string
                overrides:
                  type: string
      operationId: postPwappload
      x-operation-id-source: derived
  /tasks#appdomeTest:
    post:
      tags:
      - Tasks
      description: 'This API runs Appdome’s Standard Launch Tests on a previously built and signed app.

        Pass the `parent_task_id` (the “Appdome Build ID” returned by the build/fuse task) whose app has already been signed.

        The test runs a fixed suite (first launch, second launch, and background launch) across Appdome’s device pool; no test configuration parameters are required.

        Note: apps built via the Build-to-Test flow are not eligible — only regular fuse/build (then sign) apps can run Appdome Test.

        Upon success, poll GET /tasks/{task_id}/status until the status is completed.'
      summary: Run Appdome Test (Standard Launch Tests)
      parameters:
      - description: Personal or team ID
        example: personal
        name: team_id
        in: query
        schema:
          type: string
          default: personal
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: ID of the created Appdome Test task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    example: lix-X4WwvH6joI9DqjdlnQ
                    description: ID of the created Appdome Test task
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - appdome_test
                parent_task_id:
                  type: string
                  description: The Appdome Build ID of a built and signed app (non Build-to-Test lineage).
      operationId: postTasks#appdomeTest
      x-operation-id-source: derived
