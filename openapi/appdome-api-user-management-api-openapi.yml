openapi: 3.2.0
info:
  version: 1.0.0
  title: Appdome API User Management API
servers:
- url: https://fusion.appdome.com/api/v1
  description: Main Appdome API Server
- url: '{aws_upload_link}'
  description: S3 Upload URL
  variables:
    aws_upload_link:
      default: ''
      description: The S3 bucket name from the pre-signed URL. Obtained from 'Get AWS Upload Link' route.
tags:
- name: API User Management
paths:
  /myCompany/users/{userId}/blockUser:
    put:
      tags:
      - API User Management
      description: Allows you to change an existing company user account status to blocked.
      summary: Block a Company User API
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_name:
                    type: string
                    description: The user first name
                    example: John
                  last_name:
                    type: string
                    description: The user last name
                    example: Doe
                  name:
                    type: string
                    description: The user display name
                    example: John Doe
                  email:
                    type: string
                    description: The user email address
                    example: john@doe.com
                  status:
                    type: string
                    description: The user account status - Active or Blocked
                    example: Blocked
                  last_activity:
                    type: string
                    description: The date and time of the user last activity on the Appdome Date and time
                    example: 18/09/2022
                  api_token_enabled:
                    type: string
                    description: 1 if the user have active API access to REST API, 0 if not.
                    example: '0'
                  api_token_permissions:
                    type: string
                    description: '["write", "read"]// Permissions to Appdome''s Management API'
                    example: '[]'
      operationId: putMyCompanyUsersByUserIdBlockUser
      x-operation-id-source: derived
  /myCompany/users:
    post:
      tags:
      - API User Management
      description: Allows you to create a new user account that belongs to your company.
      summary: Create a Company User API
      parameters: []
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: created
                  userDetails:
                    type: object
                    example:
                      id: 064003c0-6472-11eb-a118-fddfdd51
                      first_name: John
                      last_name: Doe
                      email: john@doe.com
                      status: Active
                      api_token_enabled: '1'
                      api_token_permissions: Write
                      country: US
                      api_token: AUTH_KEY
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  required:
                  - first_name
                  - last_name
                  - email
                  - api_token_enabled
                  - api_token_permissions
                  properties:
                    first_name:
                      type: string
                      description: The user first name
                      example: The user first name
                    last_name:
                      type: string
                      description: The user last name
                      example: The user last name
                    email:
                      type: string
                      description: The user email
                      example: The user email
                    status:
                      type: string
                      description: active or blocked //(default is active)
                      example: active or blocked //(default is active)
                    country:
                      type: string
                      description: iso alpha-2 country code
                      example: iso alpha-2 country code
                    api_token_enabled:
                      type: integer
                      enum:
                      - 0
                      - 1
                      description: 1 - user will have active API access to REST API, 0 - otherwise
                      example: 1
                    api_token_permissions:
                      type: array
                      items:
                        type: string
                        enum:
                        - read
                        - write
                        - functional
                      description: 'Array of API token permissions: read, write, or functional'
                      example:
                      - read
                      - write
      operationId: postMyCompanyUsers
      x-operation-id-source: derived
    get:
      tags:
      - API User Management
      description: Allows you to retrieve your company users accounts status, permissions, and information.
      summary: Retrieve All Company Users API
      parameters:
      - in: query
        name: page
        description: The current page from the results - start from 0
        schema:
          type: integer
      - in: query
        name: limit
        description: Number of results for page - default 20, max 100
        schema:
          type: integer
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user data
          content:
            application/json:
              schema:
                type: array
                description: array of users
                items:
                  type: object
                  example:
                    user_id: 064003c0-6472-11eb-a118-fddfdd51
                    first_name: John
                    last_name: Deo
                    name: John Deo
                    email: john@deo
                    status: Active
                    country: US
                    last_activity: 19/8/2022
                    api_token_enabled: 1
                    api_token_permissions:
                    - write
                    - read
      operationId: getMyCompanyUsers
      x-operation-id-source: derived
  /myCompany/users/{userId}:
    delete:
      tags:
      - API User Management
      description: Allows you to delete a company user. This action cannot be undone.
      summary: Delete a Company User API
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: User successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code
                    example: 200
        '404':
          description: User not found
          content:
            application/json: {}
      operationId: deleteMyCompanyUsersByUserId
      x-operation-id-source: derived
    get:
      tags:
      - API User Management
      description: Allows you to retrieve your company user account status, permissions, and information.
      summary: Retrieve a Company User API
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The user ID number
                    example: 064003c0-6472-11eb-a118-fddfdd51
                  first_name:
                    type: string
                    description: The user first name
                    example: John
                  last_name:
                    type: string
                    description: The user last name
                    example: Doe
                  name:
                    type: string
                    description: The user display name
                    example: John Doe
                  email:
                    type: string
                    description: The user email address
                    example: john@doe.com
                  status:
                    type: string
                    description: The user account status - Active or Blocked
                    example: Active
                  last_activity:
                    type: string
                    description: The date and time of the user last activity on the Appdome Date and time
                    example: 18/09/2022
                  api_token_enabled:
                    type: string
                    description: 1 if the user have active API access to REST API, 0 if not.
                    example: '1'
                  api_token_permissions:
                    type: string
                    description: '["write", "read"]// Permissions to Appdome''s Management API'
                    example: '["write"]'
                  country:
                    type: string
                    description: The user country code
                    example: US
      operationId: getMyCompanyUsersByUserId
      x-operation-id-source: derived
    put:
      tags:
      - API User Management
      description: Allows you to update an existing company user account.
      summary: Update a Company User API
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user data
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 064003c0-6472-11eb-a118-fddfdd51
                  first_name: John
                  last_name: Doe
                  name: John Doe
                  email: john@doe.com
                  status: Active
                  api_token_enabled: '1'
                  api_token_permissions: Write
                  country: US
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  properties:
                    first_name:
                      type: string
                      description: The user first name
                      example: The user first name
                    last_name:
                      type: string
                      description: The user last name
                      example: The user last name
                    status:
                      type: string
                      description: active or blocked //(default is active)
                      example: active or blocked //(default is active)
                    country:
                      type: string
                      description: iso alpha-2 country code
                      example: iso alpha-2 country code
                    api_token_enabled:
                      type: integer
                      enum:
                      - 0
                      - 1
                      description: 1 - user will have active API access to REST API, 0 - otherwise
                      example: 1
                    api_token_permissions:
                      type: array
                      items:
                        type: string
                        enum:
                        - read
                        - write
                        - functional
                      description: 'Array of API token permissions: read, write, or functional'
                      example:
                      - read
                      - write
      operationId: putMyCompanyUsersByUserId
      x-operation-id-source: derived
  /myCompany/events:
    get:
      tags:
      - API User Management
      description: 'REST API for retreiving loginlogout within your company.

        The codes are 3000 (User Login), 3001 (Azure Login), 3004 (Okta Login), 3005 (Ping Login), 3006 (Passkey Login), 3010 (User Login Failed), 3073 (User Signed Out Manually)'
      summary: Login and Logout Events Company Users API
      parameters:
      - in: query
        name: start_date
        description: mm/dd/yyyy start_date cannot be earlier than 3 months ago
        schema:
          type: string
      - in: query
        name: end_date
        description: mm/dd/yyyy end_date should be after start_date
        schema:
          type: string
      - in: query
        name: page
        description: The current page from the results - start from 0
        schema:
          type: string
      - in: query
        name: per_page
        description: Number of results for page - default 30
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested company audit logs
          content:
            application/json:
              schema:
                type: array
                description: array of logs
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      example: '2022-10-19T16:23:31.202Z'
                    code:
                      type: string
                      example: '3001'
                    message:
                      type: string
                      example: john@doe.com signed in successfully with office 365
                    id:
                      type: string
                      example: 5edf1620-4fca-11ed-98f2-3d22aa67eaf2
                    data:
                      type: object
                      example:
                        account_id: 0a57d651-0260-11f0-9f95-4b99db8f8b32
                        username: john@doe.com
                        user_id: 0a57d650-0260-11f0-9f95-4b99db8f8b32
                        browser_info:
                          origin: https://www.google.com
                          userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36
                          referrer: https://www.google.com
                          user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36
                          accept-encoding: gzip, deflate, br, zsts
                          accept-language: en-US,en:q=0.5
                example:
                - timestamp: '2022-10-19T16:26:31.202Z'
                  code: '3001'
                  message: john@doe.com signed in successfully with office 365
                  id: 5edf1620-4fca-11ed-98f2-3d22aa12abf2
                  data:
                    user_username: john@doe.com
                    user_id: 0a7fa790-fadc-11ec-8654-3113024f3356
                    account_id: 0a7fa790-fadc-11ec-8654-3113024f3356
                    browser_info:
                      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
                      referer: https://fusion.appdome.com/
                      accept-encoding: gzip, deflate, br, zstd
                      accept-language: US
                    client_ip: 0.0.0.0
      operationId: getMyCompanyEvents
      x-operation-id-source: derived
  /myCompany/users/{userId}/refreshToken:
    post:
      tags:
      - API User Management
      description: Allows you to refresh an existing company user Appdome’s Build2Secure API Token.
      summary: Reset Company User Appdome’s Build2Secure API Token
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: The requested user id
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_token:
                    type: string
                    description: The user new Auth key
                    example: AUTH_KEY
      operationId: postMyCompanyUsersByUserIdRefreshToken
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
x-provenance:
  method: harvested
  publisher: Appdome
  source: https://fusion.appdome.com/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
