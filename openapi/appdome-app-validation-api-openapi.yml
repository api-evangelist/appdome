openapi: 3.2.0
info:
  version: 1.0.0
  title: Appdome App Validation API
servers:
- url: https://fusion.appdome.com/api/v1
  description: Main Appdome API Server
- url: '{aws_upload_link}'
  description: S3 Upload URL
  variables:
    aws_upload_link:
      default: ''
      description: The S3 bucket name from the pre-signed URL. Obtained from 'Get AWS Upload Link' route.
tags:
- name: App Validation
paths:
  /validation/{appId}/status:
    get:
      tags:
      - App Validation
      description: Get App Validation Status
      summary: Validation Status
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - apiKey: []
      responses:
        '200':
          description: Validation Upload
          content:
            application/json:
              schema:
                type: object
                description: State of app validation task, including messages and errors.
                properties:
                  validation_state:
                    type: string
                    example: failed | completed
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: The app is correctly by owner
                  error:
                    type: string
                  build_id:
                    type: string
                    example: f7e71910-89bb-12ec-917f-1b9d901c5836
                  app_type:
                    type: string
                    example: apk
                  app_name:
                    type: string
                    example: App name
                  app_pack_id:
                    type: string
                    example: com.app.name
                  app_version:
                    type: string
                    example: 1.0.0
                  app_build_number:
                    type: string
                    example: '10001'
                  app_id:
                    type: string
                    example: f7e71910-89bb-12ec-917f-1b9d901c5836
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      operationId: getValidationByAppIdStatus
      x-operation-id-source: derived
  /validation/upload:
    post:
      tags:
      - App Validation
      description: Upload an application to validate its integrity.
      summary: Validation Upload
      parameters: []
      security:
      - apiKey: []
      responses:
        '200':
          description: Validation Upload
          content:
            application/json:
              schema:
                type: object
                description: Id of app validation task
                properties:
                  id:
                    type: string
                    example: f7e71910-89bb-12ec-917f-1b9d901c5836
        '429':
          description: user rate limit has exceed..
          content:
            application/json: {}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: underscore is not accepted in filename
      operationId: postValidationUpload
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
x-provenance:
  method: harvested
  publisher: Appdome
  source: https://fusion.appdome.com/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
