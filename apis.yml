apis:
- name: Appdome Build2Secure API
  description: >-
    The Appdome Build2Secure (DEV-API) REST API automates Appdome's no-code mobile
    app defense pipeline — upload, build/fuse, add context, sign (standard, private,
    and Auto-DEV signing), download, publish to OTA, validate, generate Certified
    Secure certificates, manage company teams and users, and read DEV-Logs audit
    events. Tasks are asynchronous and tracked by task_id.
