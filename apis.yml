aid: appdome

name: Appdome

description: Appdome is a mobile app defense and DevSecOps platform that lets development and security teams add cyber-defense, anti-fraud, anti-malware,
  anti-cheat, and runtime protections to Android and iOS apps with no code and no SDK. Its Build2Secure ("DEV-API") REST API connects the no-code
  build, fuse, context, sign, and publish steps to CI/CD systems such as GitHub, GitLab, Jenkins, Azure DevOps, Bitrise, CircleCI, and TeamCity,
  enabling teams to protect, sign, certify, and release mobile apps automatically at scale. The platform also covers app validation, Certified
  Secure certificates, team and user management, DEV-Logs audit events, and device-matching services. Appdome is backed by Menlo Ventures.

